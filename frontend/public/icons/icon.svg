<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="#1e293b"/>

  <!-- Book body -->
  <rect x="110" y="100" width="260" height="320" rx="18" fill="#312e81"/>
  <rect x="136" y="100" width="234" height="320" rx="14" fill="#4338ca"/>

  <!-- Book spine line -->
  <rect x="136" y="100" width="6" height="320" fill="#3730a3"/>

  <!-- Text lines on book -->
  <rect x="168" y="178" width="160" height="14" rx="7" fill="#818cf8"/>
  <rect x="168" y="214" width="160" height="14" rx="7" fill="#818cf8"/>
  <rect x="168" y="250" width="120" height="14" rx="7" fill="#6366f1" opacity="0.7"/>
  <rect x="168" y="286" width="140" height="14" rx="7" fill="#6366f1" opacity="0.5"/>

  <!-- Emerald check circle (bottom-right) -->
  <circle cx="352" cy="352" r="88" fill="#0f172a"/>
  <circle cx="352" cy="352" r="74" fill="#059669"/>

  <!-- Checkmark -->
  <path d="M316 352 L341 377 L390 322"
        stroke="white" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
</svg>
